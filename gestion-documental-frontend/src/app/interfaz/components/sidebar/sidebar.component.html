<mat-sidenav-container class="contenedor">
  <mat-sidenav #menu class="menu-lateral" [mode]="esMovil() ? 'over' : 'side'" [opened]="!esMovil()">
    <div class="menu-interior">
      <div class="marca">
        <mat-icon class="marca-icono">inventory_2</mat-icon>
        <span class="marca-nombre">Archivero</span>
      </div>

      <nav class="navegacion" aria-label="Navegación principal">
        <a class="enlace-nav" routerLink="/carpetas" routerLinkActive="activo" (click)="cerrarSiMovil(menu)">
          <mat-icon>folder_open</mat-icon>
          <span>Mis documentos</span>
        </a>
      </nav>

      <div class="almacenamiento">
        <mat-icon>database</mat-icon>
        <div class="almacenamiento-texto">
          <span class="almacenamiento-etiqueta">Espacio usado</span>
          <strong>{{ usuariosService.almacenamientoUsado() | tamano }}</strong>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="barra">
      <button mat-icon-button (click)="menu.toggle()" aria-label="Mostrar u ocultar el menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="espaciador"></span>

      <button mat-button class="boton-usuario" [matMenuTriggerFor]="menuUsuario" aria-label="Menú de usuario">
        <span class="avatar">{{ inicial() }}</span>
        <span class="datos-usuario">
          <span class="nombre">{{ autenticacion.usuario()?.nombre }}</span>
          <span class="rol">{{ etiquetaRol() }}</span>
        </span>
      </button>
      <mat-menu #menuUsuario="matMenu">
        <button mat-menu-item (click)="autenticacion.cerrarSesion()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
