<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<mat-dialog-content>
  <p class="mensaje">{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close cdkFocusInitial>Cancelar</button>
  <button mat-flat-button [class.peligro]="datos.peligro" [mat-dialog-close]="true">
    {{ datos.boton }}
  </button>
</mat-dialog-actions>
