<h2 mat-dialog-title>Mover "{{ datos.carpeta.nombre }}"</h2>

<mat-dialog-content>
  <app-selector-carpeta [excluirId]="datos.carpeta._id" [(ubicacion)]="destino" />

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button mat-flat-button type="button" [disabled]="!puedeMover() || enviando()" (click)="mover()">
    Mover aquí
  </button>
</mat-dialog-actions>
