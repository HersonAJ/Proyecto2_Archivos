<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <mat-dialog-content>

    <!-- Input de archivo oculto -->
    <input
      #fileInput
      type="file"
      accept=".txt,.md"
      (change)="onFileChange($event)"
      style="display: none;"
    />

    <!-- Zona de selección: acepta clic, teclado y arrastrar y soltar -->
    <div class="file-drop-area"
         [class.arrastrando]="arrastrando()"
         role="button"
         tabindex="0"
         aria-label="Seleccionar un archivo"
         (click)="seleccionarArchivo()"
         (keydown.enter)="onTeclado($event)"
         (keydown.space)="onTeclado($event)"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave()"
         (drop)="onDrop($event)">
      @if (archivoSeleccionado(); as file) {
        <mat-icon color="primary">insert_drive_file</mat-icon>
        <div class="file-info">
          <span class="file-name">{{ file.name }}</span>
          <span class="file-size">{{ file.size | tamano }}</span>
        </div>
        <button mat-icon-button type="button" class="btn-limpiar" aria-label="Quitar archivo" (click)="limpiarArchivo($event)">
          <mat-icon>close</mat-icon>
        </button>
      } @else {
        <mat-icon>cloud_upload</mat-icon>
        <span>Haz clic o arrastra un archivo aquí (.txt o .md)</span>
      }
    </div>

    <!-- Campo de etiquetas -->
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Etiquetas (opcional)</mat-label>
      <input matInput formControlName="etiquetas" placeholder="ej: informe, 2024, borrador" maxlength="400" />
      <mat-hint>Separa las etiquetas con comas</mat-hint>
    </mat-form-field>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="enviando() || !archivoSeleccionado()">
      @if (enviando()) {
        <mat-icon class="spin">sync</mat-icon>
      }
      {{ enviando() ? 'Subiendo...' : datos.boton }}
    </button>
  </mat-dialog-actions>
</form>
