services:
  mongodb:
    image: mongo:7
    container_name: gestion-documental-mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: gestion_documental_db
    volumes:
      - gestion_documental_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: gestion-documental-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  gestion_documental_data:
